name: CI

# Java SDK 的门禁：编译（-Xlint:all -Werror、doclint）与全部测试（含按 spec/ 一致性向量的测试，以及用规范仓库的黑盒运行器验证示例插件 echo），
# ubuntu 与 windows；ubuntu 上另外核对提交的插件协议代码与 spec/plugin/plugin.proto 重新生成的一致。
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 构建与测试
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出（含规范 submodule）
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 黑盒运行器是规范仓库里的 Go 程序，一致性测试以 go run 从 submodule 运行它；没有 Go 时那个测试失败，所以 CI 必须装上
      - name: 安装 Go（一致性测试的黑盒运行器）
        uses: actions/setup-go@v6
        with:
          go-version-file: spec/conformance/go.mod
          cache-dependency-path: spec/conformance/go.sum

      - name: 核对生成的插件协议代码
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mvn -B -ntp -Pprotocol process-sources
          git add --intent-to-add src/main/java/com/xihanfun/framework/plugin/v1
          git diff --exit-code -- src/main/java/com/xihanfun/framework/plugin/v1

      - name: 构建与测试
        run: mvn -B -ntp verify
